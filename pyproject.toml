[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "webhook-engine"
version         = "0.2.0"
description     = "Durable, signed, per-tenant webhook delivery — library and standalone microservice"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
    # No [asyncio] extra: since redis>=4.2 the async client ships in the base
    # package, and asking for the extra makes resolvers warn (then error).
    "redis>=5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
pg    = ["asyncpg>=0.29", "sqlalchemy[asyncio]>=2.0"]
mongo = ["motor>=3.4"]
# Event-bus fan-out integration (define events as classes, emit on a bus). The
# core delivery service does not need it. asyncbus is a private zlexdev package:
#   pip install -e ".[bus]" --find-links <private-index>   # or install asyncbus first
bus   = ["asyncbus>=0.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "pytest-httpx>=0.30",
    "fakeredis>=2.20",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/zlexdev/webhooks-engine"
Changelog  = "https://github.com/zlexdev/webhooks-engine/blob/master/CHANGELOG.md"

[project.scripts]
webhook-engine = "webhook_engine.service.app:main"

# ── package layout ───────────────────────────────────────────────────────────
# ONE top-level package. The logging/time shims live in webhook_engine/_shared/
# rather than a top-level libs/ — that name is too generic to claim in a
# consumer's site-packages, and the collision would surface as a wrong import
# rather than an install error.

[tool.setuptools.packages.find]
where   = ["."]
include = ["webhook_engine*"]

[tool.setuptools.package-data]
"webhook_engine" = ["py.typed"]

# ── tool configs ─────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "BLE"]
# B008: Depends()/Header() in defaults is the idiomatic FastAPI pattern.
ignore = ["ANN101", "ANN102", "B008"]

[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = false

# asyncbus is an optional dependency (the `bus` extra). Let the type-checker
# pass whether or not it is installed — the bus modules degrade to Any without it.
[[tool.mypy.overrides]]
module                 = "asyncbus.*"
ignore_missing_imports = true

# Consequence of the override above: without asyncbus installed its base classes
# resolve to Any, and strict mode rejects subclassing Any. These two modules do
# exactly that, by design — they are the optional bus surface. Anywhere asyncbus
# IS installed (a consumer with the `bus` extra) they are checked normally; here
# the type-checker simply has nothing to check them against.
[[tool.mypy.overrides]]
module             = ["webhook_engine.events", "webhook_engine.fanout"]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.coverage.run]
source = ["webhook_engine"]
branch = true
